name: Snowflake Infra

on:
  push:
    branches: ['initial-setup']
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::656559336744:role/airbnb-pipeline-snowflake-github-actions
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
        working-directory: infra

      - run: terraform plan -out=tfplan
        working-directory: infra

      - run: terraform apply tfplan
        if: github.event_name == 'push'
        working-directory: infra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: pip install schemachange

      - name: Write connections file
        if: github.event_name == 'push'
        run: |
          cat > connections.toml <<'EOF'
          [tfsvc]
          account = "XJVCLEX-NNC43628"
          user = "TF_SVC"
          role = "TF_DEPLOY"
          warehouse = "TRANSFORM_WH"
          authenticator = "WORKLOAD_IDENTITY"
          workload_identity_provider = "AWS"
          EOF
          chmod 600 connections.toml

      - name: Run migrations
        if: github.event_name == 'push'
        env:
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: AWS
        run: |
          schemachange deploy \
            -f migrations \
            --connections-file-path connections.toml \
            --connection-name tfsvc \
            --create-change-history-table \
            --change-history-table RAW_DB.SCHEMACHANGE.CHANGE_HISTORY

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Get Snowflake OIDC token
        if: github.event_name == 'push'
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "SNOWFLAKE_WORKLOAD_IDENTITY_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: dbt debug
        if: github.event_name == 'push'
        working-directory: transform
        run: dbt debug